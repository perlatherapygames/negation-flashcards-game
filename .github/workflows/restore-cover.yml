name: Restore cover
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore cover.png from history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show 333fdf2:negation_cover.png > cover.png
          ls -l cover.png
          git add cover.png
          git commit -m "Restore real PNG cover"
          git push
